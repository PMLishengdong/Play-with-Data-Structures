plugins {
    id 'com.android.application' // or 'com.android.library'
}

android {
    namespace 'com.trae.agent'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // JSON parsing (bundled in Android, but explicit for Java-only env)
    implementation 'org.json:json:20231013'
}